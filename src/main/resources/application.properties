spring.application.name=autoloc-api

# Contexte racine commun de l'API
server.servlet.context-path=/api

# Connexion a la base de donnees MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson - serialisation des proxies LAZY Hibernate
spring.jackson.serialization.fail-on-empty-beans=false

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
